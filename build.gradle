plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    //testImplementation 'org.testng:testng:7.6.1'
    implementation 'org.seleniumhq.selenium:selenium-java:4.5.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:6.0.1'

    testImplementation("io.cucumber:cucumber-testng:7.9.0")
    testImplementation("io.cucumber:cucumber-core:7.9.0")
    testImplementation("io.cucumber:cucumber-java:7.9.0")
    testImplementation("io.cucumber:gherkin:25.0.2")
}

test {
    useTestNG() {
        systemProperty "browser", System.getProperty("browser")

        include '**/CucumberRunner.class'
        exclude "**/oldTests/**"
    }
}